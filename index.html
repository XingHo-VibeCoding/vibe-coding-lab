<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>随手笔记 NoteLab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">随手笔记</h1>
    <span class="app-sub">NoteLab · 打开就能写，写完找得回</span>
    <span id="note-count" class="note-count"></span>
  </header>

  <!-- ===== 视图导航（Day 13）=====
       用 <a href="#/..."> 而不是按钮：浏览器自带的前进/后退键就变成了"返回上一页"，
       双击打开（file://）时也照样工作 —— 这是选 hash 路由而不是 History API 的直接原因。 -->
  <nav id="view-nav" class="view-nav" aria-label="主导航">
    <a class="view-link" href="#/write" data-view="write">写笔记</a>
    <a class="view-link" href="#/notes" data-view="notes">全部笔记</a>
    <a class="view-link" href="#/review" data-view="review">回顾</a>
  </nav>

  <main class="app-main">
    <!-- ===== 演示模式提示条（只在网址带 ?demo=1 时显示，Day 8）===== -->
    <div id="demo-banner" class="demo-banner" hidden>
      <span class="demo-title">演示模式：当前显示的是本地假数据</span>
      <span class="demo-links">
        四种页面状态预览：
        <!-- Day 13：状态面板在「全部笔记」视图里，所以链接要带上 #/notes -->
        <a href="?demo=1&amp;state=loading#/notes">加载中</a>
        <a href="?demo=1&amp;state=success#/notes">有数据</a>
        <a href="?demo=1&amp;state=empty#/notes">空</a>
        <a href="?demo=1&amp;state=error#/notes">出错</a>
        <!-- 注意：这里必须写 index.html，不能写 ./ 。
             ./ 指的是"当前目录"，用文件方式打开（file://）时会变成文件夹本身，
             浏览器就会显示文件夹内容，而不是回到页面。 -->
        <a href="index.html">退出演示</a>
      </span>
    </div>

    <!-- ============================================================
         视图一：写笔记（默认视图 —— PRD 验收 1.1「打开就能写」）
         ============================================================ -->
    <section id="view-write" class="view" aria-labelledby="title-write">
      <h2 id="title-write" class="view-title">写笔记</h2>

      <!-- F1 写笔记 -->
      <section class="composer">
        <textarea id="note-input" rows="3"
          placeholder="想记点什么？直接写就行。用 #标签 归类，例如：今天想到一个点子 #想法"></textarea>
        <div class="composer-footer">
          <span id="input-hint" class="hint"></span>
          <span id="char-count" class="counter">0 / 5000</span>
          <button id="save-btn" class="btn-primary" type="button">保存（Ctrl+Enter）</button>
        </div>
      </section>

      <!-- 最近 3 条：写完立刻看得到，不必切视图才知道存没存上 -->
      <section class="recent">
        <h3 class="recent-title">最近 3 条</h3>
        <p id="recent-tip" class="state-tip" hidden></p>
        <ul id="recent-list" class="note-list"></ul>
        <p id="recent-empty" class="empty-state" hidden>还没有笔记。在上面写下第一条吧。</p>
        <p class="view-more"><a href="#/notes">去看全部笔记 →</a></p>
      </section>
    </section>

    <!-- ============================================================
         视图二：全部笔记（F2 标签筛选 + F3 搜索 + 列表 + 四种页面状态）
         ============================================================ -->
    <section id="view-notes" class="view" aria-labelledby="title-notes" hidden>
      <h2 id="title-notes" class="view-title">全部笔记</h2>

      <!-- F3 搜索 -->
      <section class="toolbar">
        <input id="search-input" type="search" placeholder="搜索笔记：正文和标签都能搜">
      </section>

      <div class="layout">
        <!-- F2 标签侧栏 -->
        <aside class="sidebar">
          <h2 class="sidebar-title">标签</h2>
          <ul id="tag-list" class="tag-list"></ul>
        </aside>

        <!-- 笔记列表 -->
        <section class="list-area">
          <div id="list-status" class="list-status"></div>

          <!-- 加载中 / 出错 两种状态的面板（Day 8）-->
          <div id="state-panel" class="state-panel" hidden></div>

          <ul id="note-list" class="note-list"></ul>
          <p id="empty-state" class="empty-state">还没有笔记。在上面写下第一条吧。</p>

          <!-- Day 13 修：列表的四种状态（加载中 / 有数据 / 空 / 出错）原来**只能靠手打网址参数**
               ?demo=1&state=… 才能看到，页面上没有任何入口 —— 功能在，但用户走不到，
               等于"全部笔记上没有四种状态"。这里在状态所在的位置补一个常驻入口。
               进了演示模式后，顶部提示条上就能直接切换四种状态，这句会自己收起来。 -->
          <p id="demo-entry" class="demo-entry">
            想看这一页在「加载中 / 空 / 出错」时分别长什么样？
            <a href="?demo=1&amp;state=success#/notes">打开演示模式 →</a>
          </p>
        </section>
      </div>
    </section>

    <!-- ============================================================
         视图三：回顾（F4 翻一翻独立成视图 —— 它本来就挤在列表底部，不好找）
         ============================================================ -->
    <section id="view-review" class="view" aria-labelledby="title-review" hidden>
      <h2 id="title-review" class="view-title">回顾</h2>
      <p class="view-desc">随机翻出一条旧笔记 —— 记了不看，等于没记。</p>

      <div class="review-bar">
        <button id="random-btn" class="btn-primary" type="button">翻一翻</button>
        <span id="review-status" class="list-status"></span>
      </div>

      <div id="random-card" class="random-card" hidden></div>
    </section>
  </main>

  <script src="mock-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
